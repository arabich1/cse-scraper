name: Build Excel

on:
  schedule:
    # Après la clôture : reconstruit uniquement le classeur du mois (aucun scraping)
    - cron: "15 15 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  excel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scraper/build_excel.py
      - name: Commit
        run: |
          git config user.name "bourse-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "excel: $(date -u +'%Y-%m-%d')" && git pull --rebase && git push)
